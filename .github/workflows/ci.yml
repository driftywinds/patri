name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install (pinned, hashed)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Tests
        run: .venv/bin/python -m unittest discover -s tests -t . -v
      - name: Audit dependencies
        run: |
          .venv/bin/pip install pip-audit
          .venv/bin/pip-audit

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pnpm
        run: npm i -g pnpm@11.28.5
      - name: Install (lockfile enforced)
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Build
        run: pnpm build

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t patri:ci .
